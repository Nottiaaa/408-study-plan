  'use strict';
  const D=JSON.parse(document.getElementById('data').textContent);
  const KEY='408-wrong-questions-v2-20261111';
  const PENDING='408-wrong-questions-unsynced-v2';
  let state={question:{},topic:{},task:{}}, delta={question:{}}, selected='ds', hideDone=false, filter='';
  try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x?.question)state=x;}catch(e){}
  try{const x=JSON.parse(localStorage.getItem(PENDING)||'null');if(x?.question)delta=x;}catch(e){}
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const subject=id=>D.subjects.find(s=>s.id===id);
  function status(id){return delta.question[id]||state.question[id]||'pending';}
  function lab(v){return {done:'已完成',review:'待巩固',active:'进行中',pending:'待复习'}[v]||'待复习';}
  function groupStatus(g){
    const st=g.questions.map(q=>status(q.id));
    return st.every(x=>x==='done')?'done':st.some(x=>x==='active')?'active':st.some(x=>x==='review')?'review':'pending';
  }
  function summary(s){
    const qids=[...new Set(s.groups.flatMap(g=>g.questions.map(q=>q.id)))];
    const done=qids.filter(id=>status(id)==='done').length;
    return `${done}/${qids.length}`;
  }
  function qHTML(q){
    const st=status(q.id);
    const d=q.details.map(t=>`${esc(t.node)} 扣 ${t.loss} 分`).join(' · ');
    return `<div class="qrow ${st==='done'?'completed':''}" data-q="${esc(q.id)}">
      <div class="qname"><strong>${q.year} ${esc(q.number)}</strong><small>${esc(q.type)} · 本考点扣 ${q.loss} 分${d?` · ${d}`:''}</small></div>
      <select data-question="${esc(q.id)}" aria-label="${q.year} ${esc(q.number)} 复习状态">
        ${['pending','active','review','done'].map(v=>`<option value="${v}" ${v===st?'selected':''}>${lab(v)}</option>`).join('')}
      </select>
    </div>`;
  }
  function makeGroup(g,i){
    const qs=g.questions.filter(q=>(!hideDone||status(q.id)!=='done')&&(!filter||[g.name,q.year,q.number,q.details.map(d=>d.node).join(' ')].join(' ').toLowerCase().includes(filter)));
    if(!qs.length)return '';
    const st=groupStatus(g);
    return `<details class="group" ${i<3||filter?'open':''}>
      <summary><span class="ord">${i+1}</span><span class="gcontent"><strong>${esc(g.name)}</strong>
        <span class="subline">历史错题 ${g.questions.length} 道 · 已完成 ${g.questions.filter(q=>status(q.id)==='done').length} 道</span></span>
        <span class="loss">${g.loss} 分</span><span class="marker ${st}">${lab(st)}</span><span class="caret">⌄</span>
      </summary><div class="items">${qs.map(qHTML).join('')}</div></details>`;
  }
  function render(){
    const s=subject(selected), tot= D.subjects.reduce((a,x)=>a+x.loss,0);
    $('tabs').innerHTML=D.subjects.map(x=>`<button class="tab ${selected===x.id?'selected':''}" data-tab="${x.id}">${x.short}<span class="tabloss">${x.loss} 分</span></button>`).join('');
    $('summary').innerHTML=`<div><small>2015—2025 · 408 错题专项</small><h1>${s.short} · ${esc(s.name)}</h1><p>按照历史失分从高到低复习知识点与错题。历史失分不等于当前不会。</p></div>
      <div class="metrics"><div><strong>${s.loss}</strong><small>历史失分</small></div><div><strong>${s.groups.length}</strong><small>错题知识点</small></div><div><strong>${summary(s)}</strong><small>已完成题数</small></div></div>`;
    $('list').innerHTML=s.groups.map(makeGroup).join('')||'<div class="empty">当前筛选条件下没有题目</div>';
    $('source').textContent=`原始记录共 ${D.subjects.reduce((a,x)=>a+x.nodes,0)} 个评分节点 · 四科累计 ${tot} 分 · 依照具体错因归类；综合题可同时涉及多个知识点，完成状态按同一原题同步。`;
    for(const el of document.querySelectorAll('[data-tab]'))el.onclick=()=>{selected=el.dataset.tab;filter='';$('search').value='';render();};
    for(const el of document.querySelectorAll('[data-question]'))el.onchange=()=>{
      delta.question[el.dataset.question]=el.value;
      try{localStorage.setItem(PENDING,JSON.stringify(delta));}catch(e){}
      render();
    };
    $('onlyPending').checked=hideDone;
    $('syncInfo').textContent=Object.keys(delta.question).length?`本机待同步 ${Object.keys(delta.question).length} 道题`:'已读取 GitHub 进度';
  }
  async function loadCloud(){
    try{
      const r=await fetch('./progress.json?ts='+Date.now(),{cache:'no-store'});
      if(!r.ok)throw Error('HTTP '+r.status);
      const j=await r.json();
      if(!j.state?.question)throw Error('进度文件不是新版');
      state=j.state;
      for(const [id,v]of Object.entries(delta.question))if(state.question[id]===v)delete delta.question[id];
      try{localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem(PENDING,JSON.stringify(delta));}catch(e){}
      render();
    }catch(e){$('syncInfo').textContent='云端读取失败；保留本机进度';}
  }
  async function copySync(){
    const patch=JSON.stringify(delta,null,2);
    const msg=Object.keys(delta.question).length
      ?`请通过GitHub连接更新 Nottiaaa/408-study-plan 的 main 分支 docs/progress.json，先读取最新文件SHA，将此补丁合并到 state.question，保留其余字段和所有知识点进度，更新 updated_at。不要修改网页布局。补丁：\n${patch}`
      :'请通过GitHub连接读取 Nottiaaa/408-study-plan 的 docs/progress.json，显示当前错题进度，不要无故修改布局。';
    try{await navigator.clipboard.writeText(msg);$('syncInfo').textContent='同步提示词已复制';}
    catch(e){window.prompt('复制并发送给 ChatGPT',msg);}
  }
  $('search').oninput=e=>{filter=e.target.value.trim().toLowerCase();render()};
  $('onlyPending').onchange=e=>{hideDone=e.target.checked;render()};
  $('refresh').onclick=()=>loadCloud();
  $('copy').onclick=()=>copySync();
  render();
  loadCloud();
})();</script></body></html>
