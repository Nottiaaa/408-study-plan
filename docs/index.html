:root{

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}

.brand{display:flex;gap:12px;align-items:center}
.brand-mark{border-radius:9px;background:#26372e;color:#fff;padding:9px 11px;font-size:15px;letter-spacing:.02em;font-weight:750}
.brand strong{display:block;font-size:15px;letter-spacing:-.01em}
.brand small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.buttons{display:flex;gap:8px}
.btn{border:1px solid var(--strongline);border-radius:8px;background:white;color:#495b4f;font-size:12px;font-weight:560;padding:9px 12px}
.btn:hover{background:#f3f7f4}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-top:22px;overflow-x:auto}
.tab{display:flex;gap:8px;align-items:center;border:0;border-bottom:2px solid transparent;background:transparent;padding:12px 4px;margin-bottom:-1px;color:#8d9990;white-space:nowrap}
.tab strong{font-size:14px;font-weight:680}.tab span{font-size:11px;font-variant-numeric:tabular-nums}
.tab.selected{border-bottom-color:var(--accent);color:var(--ink)}
.headline{display:flex;justify-content:space-between;align-items:flex-end;gap:22px;padding:29px 0 17px}
.eyebrow{display:block;font-size:11px;font-weight:650;letter-spacing:.055em;color:var(--muted)}
h1{font-size:28px;letter-spacing:-.04em;font-weight:750;margin:5px 0 5px}
h1 span{font-size:21px;font-weight:510;color:#718077;letter-spacing:-.02em}
.heading-text p{font-size:12px;color:var(--muted)}
.score{min-width:145px;text-align:right}.score strong{display:block;font-size:30px;font-weight:760;line-height:1.2;font-variant-numeric:tabular-nums}
.score strong span{font-size:16px;font-weight:500;color:#91a095}.score small{font-size:11px;color:var(--muted)}
.progress-track{height:5px;border-radius:6px;background:#e4eae5;overflow:hidden}
.progress-track>span{display:block;height:100%;background:#539a70;border-radius:6px;transition:width .18s}
.progress-caption{display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:var(--muted)}
.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:28px 0 9px}
.toolbar h2{font-size:15px;font-weight:710;letter-spacing:-.01em}
.toolbar p{font-size:11px;color:var(--muted);margin-top:3px}
.controls{display:flex;gap:10px;align-items:center;margin:0 0 10px}
.search{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;background:#fff;padding:11px 13px;color:var(--ink)}
.search::placeholder{color:#a5afa7}
.mode-group{display:flex;gap:3px;border:1px solid #e7ece7;border-radius:9px;background:#f0f3f0;padding:3px;white-space:nowrap}
.mode{border:0;border-radius:6px;color:#7a877e;background:transparent;font-size:12px;font-weight:580;padding:8px 13px}
.mode[aria-pressed=true]{color:var(--ink);background:white;box-shadow:0 1px 3px #1c3a2710}
.sync-info{font-size:11px;color:#7d8d81;margin:9px 0 18px;min-height:15px}
.chapter{margin-bottom:12px;background:#fff;border:1px solid var(--strongline);border-radius:13px;overflow:hidden;box-shadow:0 2px 8px #1b352407}
.chapter.complete{border-color:#c9ded0}
.chapter-summary{display:flex;align-items:center;gap:15px;min-height:95px;padding:18px 22px;list-style:none;cursor:pointer;background:#fff}
.chapter-summary::-webkit-details-marker,.topic-summary::-webkit-details-marker{display:none}
.chapter-summary:hover{background:#fbfcfb}.chapter.complete>.chapter-summary{background:#f8fbf9}
.chapter[open]>.chapter-summary{border-bottom:1px solid var(--strongline)}
.chapter-number{display:flex;align-items:center;justify-content:center;flex:0 0 34px;width:34px;height:34px;border-radius:9px;background:#f0f3f1;color:#809188;font-weight:720;font-size:12px;font-variant-numeric:tabular-nums}
.chapter-copy{display:grid;gap:4px;flex:1;min-width:0}
.chapter-copy>strong{font-size:17px;font-weight:735;letter-spacing:-.02em;line-height:1.4}
.chapter-sub{color:var(--muted);font-size:11px}
.chapter-progress{width:min(265px,92%);height:4px;background:#ebefec;border-radius:5px;overflow:hidden;margin-top:4px}
.chapter-progress i{display:block;height:100%;border-radius:5px;background:#5ba276}
.chapter-right{display:flex;align-items:center;gap:14px}
.chapter-loss{font-size:19px;font-weight:760;line-height:1.2;color:#4b5950;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chapter-loss small{display:block;font-size:10px;font-weight:450;color:var(--muted);margin-top:4px}
.chapter-state{padding:5px 9px;min-width:90px;text-align:center;font-size:11px;font-weight:670;white-space:nowrap;border-radius:6px}
.chapter-state.todo{color:#5c685f;background:#f0f2f0}.chapter-state.done{color:#26734d;background:#e8f4eb}
.chevron{display:inline-block;font-size:13px;color:#89988e;transition:transform .13s}

.chapter-body{display:flex;flex-direction:column;gap:10px;padding:16px;background:#f7f9f7}

.topic-meta{color:#85928a;font-size:11px}

.status-chip.done{background:#e4f3e8;color:#2a7d4e}
.questions{padding:0 14px;background:#fff}
.question-row{display:flex;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid #eaf0eb}

.question-row.done{background:#f7fbf8}
.question-check{width:19px;height:19px;flex:0 0 19px;border:1px solid #d8e0da;border-radius:5px;background:#fff;color:#9ca99e;display:grid;place-items:center;font-size:12px}

 const chapterOpen=new Set(),topicOpen=new Set();

 for(const obj of [state.question,delta.question]){
  for(const [id,value] of Object.entries(obj||{}))obj[id]=value==="done"?"done":"pending";
 }

 const $=id=>document.getElementById(id);

 const getStatus=id=>(delta.question[id]||state.question?.[id])==="done"?"done":"pending";
 const label={done:"已完成",pending:"未完成"};
 function uniqueQ(groups){return [...new Map(groups.flatMap(g=>g.questions.map(q=>[q.id,q]))).values()];}
 function count(gs){const qs=uniqueQ(gs);const done=qs.filter(q=>getStatus(q.id)==="done").length;return {total:qs.length,done,todo:qs.length-done};}
 function getGs(s,c){return c.groups.map(id=>s.groups.find(g=>g.id===id)).filter(Boolean).sort((a,b)=>b.loss-a.loss||a.name.localeCompare(b.name,"zh"));}
 function statusHTML(st){return `<span class="status-chip ${st}">${st==="done"?"✓ ":"○ "}${label[st]}</span>`;}
 function topicStatus(g){return g.questions.every(q=>getStatus(q.id)==="done")?"done":"pending";}
 function selectHTML(q){
  const st=getStatus(q.id),info=q.details.map(n=>`${esc(n.node)} -${n.loss}分`).join(" / ");
  return `<div class="question-row ${st}">
    <div class="question-check" aria-hidden="true">${st==="done"?"✓":"○"}</div>
    <div class="question-info"><div class="question-title">${q.year} ${esc(q.number)} <span class="question-type">${esc(q.type)}</span></div>
      <div class="question-detail">本考点历史扣 ${q.loss} 分${info?` · ${info}`:""}</div>
    </div>
    <select class="status-select ${st}" data-question="${esc(q.id)}" aria-label="${q.year} ${esc(q.number)} 复习状态">
      ${["pending","done"].map(v=>`<option value="${v}" ${v===st?"selected":""}>${label[v]}</option>`).join("")}
    </select>
  </div>`;
 }
 function topicHTML(g,idx,searchActive){
  const matchTopic=g.name.toLowerCase().includes(query);
  const qs=g.questions.filter(q=>
   (mode==="all"||(mode==="pending"&&getStatus(q.id)!=="done")||(mode==="done"&&getStatus(q.id)==="done")) &&
   (!query||matchTopic||[q.year,q.number,q.type,q.details.map(x=>x.node).join(" ")].join(" ").toLowerCase().includes(query))
  );
  if(!qs.length)return "";
  const all=count([g]),st=topicStatus(g),isOpen=searchActive||topicOpen.has(g.id);
  return `<details class="topic ${st==="done"?"is-done":"is-open"}" data-topic="${esc(g.id)}" ${isOpen?"open":""}>
    <summary class="topic-summary">
      <span class="topic-indicator">${st==="done"?"✓":"○"}</span>
      <span class="topic-copy"><strong>${esc(g.name)}</strong><span class="topic-meta">${all.done}/${all.total} 题完成 · 历史错题 ${all.total} 道</span></span>
      <span class="topic-loss">${g.loss} 分</span>
      ${statusHTML(st)}<span class="chevron">⌄</span>
    </summary><div class="questions">${qs.map(selectHTML).join("")}</div>
  </details>`;
 }
 function chapterHTML(s,ch,idx){
  const gs=getGs(s,ch),visible=gs.filter(g=>g.questions.some(q=>{
   const matchT=!query||g.name.toLowerCase().includes(query)||[q.year,q.number,q.type,q.details.map(x=>x.node).join(" ")].join(" ").toLowerCase().includes(query);
   return matchT&&(mode==="all"||(mode==="pending"&&getStatus(q.id)!=="done")||(mode==="done"&&getStatus(q.id)==="done"));
  }));
  if(!visible.length)return "";
  const c=count(gs),done=c.todo===0,open=!!query||chapterOpen.has(ch.id);
  const width=c.total?100*c.done/c.total:0;
  return `<details class="chapter ${done?"complete":"incomplete"}" data-chapter="${esc(ch.id)}" ${open?"open":""}>
    <summary class="chapter-summary">
      <span class="chapter-number">${String(idx+1).padStart(2,"0")}</span>
      <span class="chapter-copy"><strong>${esc(ch.name)}</strong>
       <span class="chapter-sub">${visible.length} 个错题知识点 · ${c.done}/${c.total} 题已完成</span>
       <span class="chapter-progress"><i style="width:${width}%"></i></span>
      </span>
      <span class="chapter-right"><span class="chapter-loss">${ch.loss}<small>历史失分</small></span>
      <span class="chapter-state ${done?"done":"todo"}">${done?"✓ 全部完成":`未完成 ${c.todo} 题`}</span><span class="chevron">⌄</span></span>
    </summary><div class="chapter-body">${visible.map((g,i)=>topicHTML(g,i,!!query)).join("")}</div>
  </details>`;
 }
 function render(){
  const s=sCurrent(),groups=s.groups,all=count(groups),percent=all.total?100*all.done/all.total:0;
  $("tabs").innerHTML=D.subjects.map(x=>`<button class="tab ${selected===x.id?"selected":""}" data-tab="${x.id}">
     <strong>${x.short}</strong><span>${x.loss} 分</span></button>`).join("");
  $("headline").innerHTML=`<div class="heading-text"><span class="eyebrow">408 · 历史错题复习 / 2015—2025</span>
   <h1>${s.short} <span>${esc(s.name)}</span></h1>
   <p>先按章节，再按章节内历史失分从高到低。已完成内容保留，不必重复复习。</p></div>
   <div class="score"><strong>${all.done}<span> / ${all.total}</span></strong><small>历史错题已完成</small></div>`;
  $("progress-fill").style.width=percent+"%";
  $("progress-label").textContent=`已完成 ${all.done} 题 · 未完成 ${all.todo} 题`;
  $("section-intro").textContent=`${s.chapters.length} 个章节 · ${s.groups.length} 个错题知识点 · 累计历史失分 ${s.loss} 分`;
  $("chapters").innerHTML=s.chapters.map((ch,i)=>chapterHTML(s,ch,i)).join("")||`<div class="empty">这个筛选条件下没有题目。可以切换到“全部”查看已完成内容。</div>`;
  for(const el of document.querySelectorAll("[data-tab]"))el.onclick=()=>{
    selected=el.dataset.tab;query="";$("search").value="";chapterOpen.clear();topicOpen.clear();
    render();
  };
  for(const el of document.querySelectorAll("[data-chapter]"))el.addEventListener("toggle",()=>{
    if(el.open)chapterOpen.add(el.dataset.chapter);else chapterOpen.delete(el.dataset.chapter);
  });
  for(const el of document.querySelectorAll("[data-topic]"))el.addEventListener("toggle",()=>{
    if(el.open)topicOpen.add(el.dataset.topic);else topicOpen.delete(el.dataset.topic);
  });
  for(const el of document.querySelectorAll("[data-question]"))el.onchange=()=>{
    delta.question[el.dataset.question]=el.value;
    try{localStorage.setItem(PENDING,JSON.stringify(delta));}catch(e){}
    render();
  };
  for(const el of document.querySelectorAll("[data-mode]"))el.setAttribute("aria-pressed",String(mode===el.dataset.mode));
  $("sync-info").textContent=Object.keys(delta.question).length?`本机有 ${Object.keys(delta.question).length} 道题等待同步到 GitHub`:(cloudOk?"云端进度已读取":"正在使用本机进度");
 }
 async function loadCloud(){
   try{
    const r=await fetch("./progress.json?ts="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw Error("HTTP "+r.status);
    const j=await r.json();
    if(!j.state?.question)throw Error("进度文件格式不符");
    state=j.state;
    for(const [id,value] of Object.entries(state.question||{}))state.question[id]=value==="done"?"done":"pending";
    for(const [id,v]of Object.entries(delta.question))if(state.question[id]===v)delete delta.question[id];
    try{localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem(PENDING,JSON.stringify(delta));}catch(e){}
    cloudOk=true;render();
   }catch(e){$("sync-info").textContent="云端读取失败，当前保留本机进度";}
 }
 async function copySync(){
   const patch=JSON.stringify(delta,null,2);
   const msg=Object.keys(delta.question).length?
    `请通过 GitHub 连接更新 Nottiaaa/408-study-plan 主分支 docs/progress.json。先读取 SHA，将补丁合并到 state.question，保留其它全部状态及 HTML 布局，更新 updated_at。补丁：\n${patch}`:
    "请通过 GitHub 连接读取 Nottiaaa/408-study-plan/docs/progress.json 的四科错题进度，不要修改网页布局。";
   try{await navigator.clipboard.writeText(msg);$("sync-info").textContent="同步提示词已复制，发送至 ChatGPT 即可提交云端";}
   catch(e){window.prompt("复制同步提示词",msg);}
 }
 $("search").addEventListener("input",e=>{
   const caret=e.target.selectionStart;query=e.target.value.trim().toLowerCase();render();
   const x=$("search");x.focus();try{x.setSelectionRange(caret,caret)}catch(e){}
 });
 for(const el of document.querySelectorAll("[data-mode]"))el.onclick=()=>{mode=el.dataset.mode;render();};
 $("refresh").onclick=loadCloud;
