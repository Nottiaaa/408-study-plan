   const id=[active,c.name].join("::"),score=tally(c.qids),expanded=!!searchTerm||openCh.has(id);
   const percent=score.total?100*score.done/score.total:0;
   return `<details class="chapter" data-ch="${escape(id)}" ${expanded?"open":""}>
     <summary class="chapter-head"><span class="chapter-num">${String(i+1).padStart(2,"0")}</span>
       <span class="chapter-info"><strong>${escape(c.name)}</strong>
         <small>${c.sections.length} 节 · ${score.done}/${score.total} 题已完成</small>
         <span class="bar"><i style="width:${percent}%"></i></span>
       </span>
       <span class="chapter-points"><b>${c.loss}</b><small>历史失分</small></span>
       <span class="chapter-badge ${score.remaining===0?"finish":""}">${score.remaining===0?"✓ 已完成":`${score.remaining}题未完成`}</span>
       <span class="arrow">⌄</span>
     </summary><div class="chapter-inner">${sections.join("")}</div></details>`;
 }
 function render(){
  const s=D.subjects.find(s=>s.id===active);
  const allIds=uniq(s.chapters.flatMap(c=>c.qids)),sum=tally(allIds);
  $("tabs").innerHTML=D.subjects.map(s=>`<button type="button" class="tab ${s.id===active?"chosen":""}" data-tab="${s.id}">${s.short}<small>${s.loss}分</small></button>`).join("");
  $("subject").textContent=`${s.short} · ${s.name}`;
  $("subtext").textContent=`${s.chapters.length} 章 · ${sum.total} 道历史错题 · 累计扣 ${s.loss} 分`;
  $("doneCount").textContent=`${sum.done}/${sum.total}`;
  $("bar").style.width=(sum.total?100*sum.done/sum.total:0)+"%";
  $("chapters").innerHTML=s.chapters.map(chapterView).join("")||'<div class="empty">当前筛选条件下没有题目。</div>';
  for(const a of document.querySelectorAll("[data-tab]"))a.onclick=()=>{active=a.dataset.tab;searchTerm="";$("search").value="";openCh.clear();openSec.clear();openLeaf.clear();render();};
  for(const a of document.querySelectorAll("[data-ch]"))a.addEventListener("toggle",()=>{a.open?openCh.add(a.dataset.ch):openCh.delete(a.dataset.ch)});
  for(const a of document.querySelectorAll("[data-sec]"))a.addEventListener("toggle",()=>{a.open?openSec.add(a.dataset.sec):openSec.delete(a.dataset.sec)});
  for(const a of document.querySelectorAll("[data-leaf]"))a.addEventListener("toggle",()=>{a.open?openLeaf.add(a.dataset.leaf):openLeaf.delete(a.dataset.leaf)});
  for(const a of document.querySelectorAll("[data-question]"))a.onchange=()=>{
    delta.question[a.dataset.question]=a.value;
    try{localStorage.setItem(PENDING,JSON.stringify(delta))}catch(e){}
    render();
  };
  for(const a of document.querySelectorAll("[data-filter]"))a.setAttribute("aria-pressed",String(a.dataset.filter===filter));
  $("sync").textContent=Object.keys(delta.question).length?`本机有 ${Object.keys(delta.question).length} 项状态待同步 GitHub`:(cloudLoaded?"已读取云端进度":"等待读取云端进度");
 }
 async function loadCloud(){
   try{
    const res=await fetch("./progress.json?t="+Date.now(),{cache:"no-store"});
    if(!res.ok)throw Error("HTTP "+res.status);
    const json=await res.json();
    if(!json.state?.question)throw Error("旧版进度文件");
    state=json.state;cloudLoaded=true;
    for(const [id,v]of Object.entries(delta.question))if((state.question?.[id]||"pending")===v)delete delta.question[id];
    try{localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem(PENDING,JSON.stringify(delta))}catch(e){}
    render();
   }catch(e){$("sync").textContent="云端读取失败，保留本机已保存的进度";}
 }
 async function copySync(){
  const patch=JSON.stringify(delta,null,2);
  const msg=Object.keys(delta.question).length?
  `请通过GitHub连接把以下状态更新合并到 Nottiaaa/408-study-plan 的 docs/progress.json 中的 state.question。仅合并这些题号，保留其它现有数据，更新 updated_at，不改HTML结构。补丁：\n${patch}`:
  "请读取 GitHub 仓库 Nottiaaa/408-study-plan 的 docs/progress.json 当前历史错题复习进度。";
  try{await navigator.clipboard.writeText(msg);$("sync").textContent="同步说明已复制";}catch(e){window.prompt("复制同步说明",msg);}
 }
 $("search").oninput=e=>{
  const val=e.target.value.trim().toLowerCase();searchTerm=val;
  render();const el=$("search");el.value=e.target.value;el.focus();
 };
 for(const a of document.querySelectorAll("[data-filter]"))a.onclick=()=>{filter=a.dataset.filter;render()};
 $("refresh").onclick=loadCloud;$("copy").onclick=copySync;
 render();loadCloud();
})();</script></body></html>
