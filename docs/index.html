},{"id":"c-09","subject":"cn","phase":"结章验收","title":"CN｜六章综合计算+概念边界","note":"跨层综合 408 选择题和真题大题，标注不确定与跳过；实错才做简短变式","refs":[],"initial":"pending","focus":""},{"id":"co01","subject":"co","phase":"存储器","title":"Cache 映射、命中率、写策略","note":"","refs":["2015 T15","2016 T15","2023 T43","2025 T43"],"initial":"pending","focus":""},{"id":"co02","subject":"co","phase":"存储器","title":"页式虚拟存储、地址转换、TLB","note":"","refs":["2015 T16","2022 T15","2023 T44","2024 T44"],"initial":"pending","focus":""},{"id":"co03","subject":"co","phase":"CPU","title":"数据通路与微操作","note":"","refs":["2015 T43","2022 T43","2025 T19"],"initial":"pending","focus":""},{"id":"co04","subject":"co","phase":"CPU","title":"控制器、指令周期","note":"","refs":["2017 T18","2020 T43","2022 T43"],"initial":"pending","focus":""},{"id":"co05","subject":"co","phase":"CPU","title":"异常、中断与响应","note":"","refs":["2019 T45","2023 T21","2024 T21","2025 T44"],"initial":"review","focus":""},{"id":"co06","subject":"co","phase":"CPU","title":"流水线冒险与性能","note":"","refs":["2023 T19"],"initial":"review","focus":""},{"id":"co07","subject":"co","phase":"总线与 I/O","title":"总线性能、事务与定时","note":"","refs":["2017 T20","2018 T21","2023 T20","2025 T20"],"initial":"pending","focus":""},{"id":"co08","subject":"co","phase":"总线与 I/O","title":"DMA、程序中断、I/O接口","note":"","refs":["2023 T22","2024 T22","2025 T21"],"initial":"review","focus":""},{"id":"co09","subject":"co","phase":"数据表示与运算","title":"补码、标志位、乘除法","note":"","refs":["2022 T43","2025 T44"],"initial":"review","focus":""},{"id":"co10","subject":"co","phase":"数据表示与运算","title":"IEEE 754、浮点加减","note":"","refs":["2017 T43","2023 T14"],"initial":"review","focus":""},{"id":"co11","subject":"co","phase":"指令系统","title":"指令格式、寻址、大小端","note":"","refs":["2015 T44","2024 T43","2025 T15"],"initial":"pending","focus":""},{"id":"co12","subject":"co","phase":"系统概述","title":"CPU 性能指标、执行过程","note":"","refs":["2015 T12","2020 T17"],"initial":"pending","focus":""},{"id":"co13","subject":"co","phase":"综合验收","title":"CO 六章混合真题","note":"","refs":["2015—2025"],"initial":"pending","focus":""},{"id":"d-done3","subject":"ds","phase":"已完成·保留记录","title":"2016 T1｜单链表逻辑顺序与指针地址","note":"2026-11-11 历史错题复测 D，2/2。明确 a.next=1014H、e.next=1004H、f.next=1010H。此题已掌握；链表算法设计大题仍单独待复习。","refs":["2016 T1"],"initial":"done","focus":""},{"id":"d-done4","subject":"ds","phase":"已完成·保留记录","title":"2018 T3｜对称矩阵上三角压缩存储","note":"2026-11-11 历史错题复测 A，2/2。12阶上三角行优先，第6行首元素 m66 在下标50；其它特殊矩阵仍需覆盖。","refs":["2018 T3"],"initial":"done","focus":""},{"id":"d-done5","subject":"ds","phase":"已完成·保留记录","title":"2017 T2｜栈与非递归、出栈序列","note":"2026-11-11 历史错题复测 C，2/2。能指出 I/III/IV 错误，非递归改写不必使用栈；本考点已掌握。","refs":["2017 T2"],"initial":"done","focus":""},{"id":"d-done6","subject":"ds","phase":"已完成·保留记录","title":"2015 T1｜递归函数调用栈","note":"2026-11-11 历史错题复测 A，2/2。调用过程 main→S(1)→S(0)，自栈底至栈顶一致；本考点已掌握。","refs":["2015 T1"],"initial":"done","focus":""},{"id":"d-done7","subject":"ds","phase":"已完成·保留记录","title":"2022 T1｜嵌套循环时间复杂度","note":"2026-11-11 历史错题复测 B，2/2。累加 1+2+4+…+2^(k-1)=Θ(n)，正确理解外层指数增长与内层总次数。","refs":["2022 T1"],"initial":"done","focus":""}],"notes":["历史扣分反映此前 11 套真题的失分，不是当前掌握度。","OS 已复习三章的状态来自近期对话：操作系统基础、进程管理、输入/输出管理；内存管理虽做过部分题，未视为整章复习完成。","CN 仅建立本轮系统复习计划，不把以前做过题视为系统完成。","用户学习状态可在本页面自行更新，浏览器本地保存。"]}</script><script>
'use strict';
const D=JSON.parse(document.getElementById('data').textContent);
const K='408-four-study-20261108'; const OL='408-tracker-ds-os-cn-20261107-v1';
let state={task:{},topic:{}};
try{let x=JSON.parse(localStorage.getItem(K)||'null');if(x&&x.task&&x.topic)state=x;else{let o=JSON.parse(localStorage.getItem(OL)||'null');if(o&&o.task&&o.topic)state={task:o.task,topic:o.topic};}}catch(e){}
let page='all',query='',onlyLoss=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(K,JSON.stringify(state))}catch(e){}};
const st=t=>state.task[t.id]||t.initial;
const tp=t=>state.topic[t.id]||t.initialStatus;
const label=x=>({done:'已完成',active:'进行中',review:'待回顾',pending:'待复习'})[x]||x;
const num=x=>D.tasks.filter(t=>t.subject===x).length;
const nDone=x=>D.tasks.filter(t=>t.subject===x&&st(t)==='done').length;
const opts=(value,type,id)=>`<select data-kind="${type}" data-id="${esc(id)}">${['pending','review','active','done'].map(s=>`<option value="${s}" ${value===s?'selected':''}>${label(s)}</option>`).join('')}</select>`;
function nav(){ $('#nav').innerHTML=[['all','总览'],...D.subjects.map(s=>[s.id,s.code])].map(([id,name])=>`<button data-page="${id}" class="tab ${page===id?'sel':''}">${name}</button>`).join('') }
function stats(){return `<div class="stats">${D.subjects.map(s=>`<div class="stat"><div class="top"><span>${s.code}</span><small>${s.chapters.length} 章</small></div><strong>${s.loss}</strong><div class="foot">失分 · 已完成 ${nDone(s.id)}/${num(s.id)}</div><div class="prog"><span style="width:${num(s.id)?100*nDone(s.id)/num(s.id):0}%"></span></div></div>`).join('')}</div>`}
function tasklist(id){let ts=D.tasks.filter(t=>!id||t.subject===id);return `<div class="panel"><div class="panel-title"><h3>任务</h3><small>${ts.filter(t=>st(t)==='done').length}/${ts.length}</small></div>${ts.map(t=>`<div class="rowtask ${st(t)==='done'?'done':''}"><input type="checkbox" data-check="${t.id}" ${st(t)==='done'?'checked':''} aria-label="完成 ${esc(t.title)}"><div><div class="name">${esc(t.title)}</div>${t.note?`<div class="note">${esc(t.note)}</div>`:''}${t.refs.length?`<div class="refs">${esc(t.refs.join(' · '))}</div>`:''}</div>${opts(st(t),'task',t.id)}</div>`).join('')}</div>`}
function chapterHTML(c){let ts=c.topics.filter(t=>(!onlyLoss||t.loss>0)&&(!query||[t.name,t.group,t.refs.join(' ')].join(' ').toLowerCase().includes(query)));if(!ts.length)return '';return `<details class="chapter" ${query||onlyLoss?'open':''}><summary><div><div class="chname">${esc(c.name)}</div><div class="chsub">${ts.length} 项 · ${label(c.initialStatus)}</div></div><div class="right"><span class="loss ${c.loss>=15?'heavy':''}">${c.loss} 分</span><span class="small">⌄</span></div></summary><div class="topics">${ts.map(t=>`<div class="topic"><div>${esc(t.group?`${t.group} · ${t.name}`:t.name)}${t.refs.length?`<div class="t-ref">${esc(t.refs.join(' / '))}</div>`:''}</div><div class="t-loss ${t.loss?'positive':''}">${t.loss}</div>${opts(tp(t),'topic',t.id)}</div>`).join('')}</div></details>`}
function chapters(id){let ss=id?D.subjects.filter(s=>s.id===id):D.subjects;return `<div class="panel"><div class="panel-title"><h3>大纲</h3><small>${ss.reduce((a,s)=>a+s.chapters.length,0)} 章</small></div><div class="filter"><input id="search" type="text" value="${esc(query)}" placeholder="知识点 / 真题号"><label><input id="lossFilter" type="checkbox" ${onlyLoss?'checked':''}>仅失分</label></div>${ss.map(s=>`<div ${id?'':'style="border-top:1px solid var(--line)"'}>${id?'':`<div class="panel-title"><h3>${s.code}</h3><small>${s.loss} 分</small></div>`}${s.chapters.map(chapterHTML).join('')||'<div class="empty">无匹配项</div>'}</div>`).join('')}</div>`}
function render(){nav();let s=D.subjects.find(x=>x.id===page);$('#main').innerHTML=(page==='all'?`${stats()}<div class="section"><div class="sectionhead"><h2>四科清单</h2><small>${D.tasks.filter(t=>st(t)==='done').length}/${D.tasks.length} 完成</small></div><div class="cols">${tasklist(null)}${chapters(null)}</div></div>`:`<div class="subject-title"><h2>${s.code} · ${s.name}</h2><small>历史失分 ${s.loss} · ${s.chapters.length} 章</small></div><div class="cols">${tasklist(page)}${chapters(page)}</div>`)}
function bind(){document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>{page=x.dataset.page;query='';onlyLoss=false;window._render();window.scrollTo(0,0)});document.querySelectorAll('[data-check]').forEach(x=>x.onchange=()=>{state.task[x.dataset.check]=x.checked?'done':'pending';save();window._render()});document.querySelectorAll('[data-kind]').forEach(x=>x.onchange=()=>{state[x.dataset.kind][x.dataset.id]=x.value;save();window._render()});let q=$('#search');if(q)q.oninput=()=>{let v=q.value,cur=q.selectionStart;query=v.trim().toLowerCase();window._render();let el=$('#search');el.focus();el.setSelectionRange(cur,cur)};let l=$('#lossFilter');if(l)l.onchange=()=>{onlyLoss=l.checked;window._render()}}
window._render=()=>{render();bind()};
$('#print').onclick=()=>window.print();
$('#export').onclick=()=>{let b=new Blob([JSON.stringify({version:D.version,state},null,2)],{type:'application/json'});let u=URL.createObjectURL(b);let a=document.createElement('a');a.href=u;a.download='408_四科进度.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};
$('#import').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!x.state||!x.state.task||!x.state.topic)throw Error('文件格式不正确');state=x.state;save();window._render()}catch(e){alert(e.message)}e.target.value=''};
window._render();
</script><script src="./sync.js" defer></script></body></html>
